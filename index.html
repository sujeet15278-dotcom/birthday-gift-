<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎉</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary-color: #ff6b81;
            --secondary-color: #ffca28;
            --background-gradient: linear-gradient(135deg, #ffeef8 0%, #e8f5ff 100%);
            --text-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--background-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
            perspective: 1000px; /* For 3D card effect if needed */
        }

        .card {
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 4px solid #fff;
            outline: 2px dashed var(--primary-color);
            outline-offset: -10px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(255, 107, 129, 0.2);
        }

        .icon {
            font-size: 4rem;
            animation: bounce 2s infinite;
            display: inline-block;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--primary-color);
            font-size: 2.2rem;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        p {
            color: var(--text-color);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .highlight {
            font-weight: 600;
            color: #70a1ff;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.4);
            transition: all 0.2s ease;
            width: 100%;
            max-width: 250px;
        }

        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 5px rgba(255, 107, 129, 0.4);
        }

        /* Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 375px) {
            h1 { font-size: 1.8rem; }
            p { font-size: 0.95rem; }
            .card { padding: 25px 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <span class="icon" id="cake-icon">🎂</span>
            <h1>Happy Birthday, <br><span style="color: var(--secondary-color);">Friend!</span></h1> 
            
            <p>Wishing you a day filled with laughter, love, and endless joy. May this upcoming year bring you closer to all your dreams! ✨</p>
            
            <button class="btn" onclick="celebrate()">Celebrate! 🎉</button>
        </div>
    </div>

    <script>
        // Trigger confetti immediately when the page loads
        window.addEventListener('DOMContentLoaded', () => {
            triggerConfetti();
        });

        // Trigger confetti when clicking the button
        function celebrate() {
            triggerConfetti();
            
            // Subtle button animation on click
            const icon = document.getElementById('cake-icon');
            icon.style.animation = 'none';
            setTimeout(() => {
                icon.style.animation = 'bounce 0.5s ease 2';
            }, 10);
        }

        function triggerConfetti() {
            // Left burst
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { x: 0.1, y: 0.8 }
            });
            // Right burst
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { x: 0.9, y: 0.8 }
            });
            // Center burst
            setTimeout(() => {
                confetti({
                    particleCount: 50,
                    angle: 90,
                    spread: 100,
                    origin: { x: 0.5, y: 0.6 }
                });
            }, 250);
        }
    </script>
</body>
</html>
